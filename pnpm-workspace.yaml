# Build-script decisions for native/optional deps. esbuild is built (its
# binary backs `tsx`); the rest are test-only or optional and skipped so a
# fresh clone never needs a build toolchain.
allowBuilds:
  esbuild: true
  msw: false
  sharp: false
  unrs-resolver: false

# Don't re-run an install check before `pnpm dev`/scripts — it turns the
# harmless "ignored build scripts" notice into a fatal error and blocks the
# quickstart. ./bin/setup already installs deps.
verifyDepsBeforeRun: false
